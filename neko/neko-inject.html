<!-- streamiso-patch -->
<script id="streamiso-patch-js">
(function () {
  // StreamISO bridge. The player page embeds Neko in an iframe, and browsers do not pass mouse or
  // key events from a cross-origin iframe to its parent. This script reports them, so the parent can
  // show its control bar and react to remote-control media keys.
  if (window.parent === window) return;

  // Keys the parent cares about (TV remotes, keyboards with media keys, Samsung Tizen key codes).
  var MEDIA = {
    MediaPlayPause: "toggle", MediaPlay: "toggle", MediaPause: "toggle",
    MediaTrackNext: "next", MediaTrackPrevious: "prev",
    MediaFastForward: "forward", MediaRewind: "rewind", MediaStop: "stop",
    10252: "toggle", 415: "toggle", 19: "toggle",
    417: "forward", 412: "rewind", 413: "stop", 10009: "back"
  };
  var BACK = { BrowserBack: 1, GoBack: 1 };
  // Menu navigation. Neko forwards these keys to VLC itself when this viewer has control of the
  // desktop; when it does not, they are reported so the catalog can send them to VLC directly.
  var NAV = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", Enter: "activate" };

  function send(msg) {
    msg.streamiso = true;
    try { window.parent.postMessage(msg, "*"); } catch (e) { /* ignore */ }
  }

  var last = 0;
  function activity() {
    var now = Date.now();
    if (now - last < 150) return;
    last = now;
    send({ type: "activity" });
  }

  ["mousemove", "mousedown", "touchstart", "wheel"].forEach(function (name) {
    window.addEventListener(name, activity, { capture: true, passive: true });
  });

  // Tell the parent when the first video frame data arrives, so it can hide its loading cover
  // (and with it Neko's own connecting screen).
  var reported = false;
  function videoReady() {
    if (reported) return;
    reported = true;
    send({ type: "video-ready" });
  }
  ["loadeddata", "playing", "canplay"].forEach(function (name) {
    document.addEventListener(name, function (e) {
      if (e.target && e.target.tagName === "VIDEO") videoReady();
    }, true);
  });

  // Report whether the stream is audible, so the parent can bring Neko's own play/unmute button
  // forward when the browser blocked autoplay with sound (audio CDs have nothing else to look at).
  var lastOk = null;
  setInterval(function () {
    var v = document.querySelector("video");
    if (!v) return;
    var ok = !v.paused && !v.muted;
    if (ok !== lastOk) { lastOk = ok; send({ type: "audio-state", ok: ok }); }
  }, 1000);

  // Some TV browsers (older Chromium builds) leave Neko's video box tiny: the picture plays, but as a
  // dot in the middle of the screen. If the video is clearly smaller than the window, stretch the video
  // and every box around it to the full window (the picture keeps its proportions). Browsers that
  // already lay it out correctly never take this path.
  // The stream page holds nothing but the picture, so it never needs scroll bars. When the picture is
  // stretched (below), a bar that appears and disappears resizes the window and makes the screen flicker.
  try {
    var noBars = document.createElement("style");
    noBars.textContent = "html, body { overflow: hidden !important; } ::-webkit-scrollbar { display: none !important; }";
    (document.head || document.documentElement).appendChild(noBars);
  } catch (e) { /* ignore */ }
  function fitVideo() {
    var v = document.querySelector("video");
    if (!v || !v.videoWidth) return;
    var W = window.innerWidth, H = window.innerHeight;
    var r = v.getBoundingClientRect();
    if (r.width >= W * 0.9 || r.height >= H * 0.9) return;
    for (var el = v; el && el !== document.body && el !== document.documentElement; el = el.parentElement) {
      el.style.setProperty("width", "100%", "important");
      el.style.setProperty("height", "100%", "important");
      el.style.setProperty("max-width", "none", "important");
      el.style.setProperty("max-height", "none", "important");
    }
    v.style.setProperty("object-fit", "contain", "important");
    document.documentElement.style.setProperty("height", "100%");
    document.body.style.setProperty("height", "100%");
    document.body.style.setProperty("margin", "0");
  }
  setInterval(fitVideo, 1000);
  window.addEventListener("resize", fitVideo);

  // Give Neko's input layer the keyboard focus as soon as the stream shows, so the remote or keyboard
  // works in the DVD menu without clicking the picture first. (Mouse input already worked: Neko
  // focuses its overlay when the pointer enters it.) Retries for a few seconds, because the overlay
  // only exists once Neko has connected.
  // On phones a focused textarea pops up the on-screen keyboard. inputmode="none" keeps the focus
  // (so hardware keyboards and remotes still work) but tells the phone not to show a keyboard.
  function noKeyboard() {
    var list = document.querySelectorAll("textarea, input");
    for (var i = 0; i < list.length; i++) {
      if (list[i].getAttribute("inputmode") !== "none") list[i].setAttribute("inputmode", "none");
      // Read-only keeps key events flowing to Neko, but browsers (Edge's Copilot rewrite icon, for
      // one) only decorate fields that can be edited. The overlay never holds any text anyway.
      if (list[i].tagName === "TEXTAREA" && !list[i].readOnly) list[i].readOnly = true;
    }
  }
  noKeyboard();
  try {
    new MutationObserver(noKeyboard).observe(document.documentElement, {
      childList: true, subtree: true, attributes: true, attributeFilter: ["inputmode"]
    });
  } catch (e) { /* ignore */ }
  function focusInput() {
    noKeyboard();
    var el = document.querySelector("textarea.overlay, .overlay textarea, textarea");
    if (!el) return false;
    try { window.focus(); el.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    return document.activeElement === el;
  }
  // Neko only passes mouse and keys to the desktop to whoever has "control", which an implicit
  // host gets by clicking first. Ask for it right away, so the disc menu answers without a click.
  var clicked = false;  // a click in the picture gives control with implicit hosting
  window.addEventListener("mousedown", function () { clicked = true; }, true);
  function hasControl() {
    if (clicked) return true;
    try {
      var root = document.getElementById("neko") || document.querySelector("[id^=app],#app");
      var vm = root && root.__vue__;
      var acc = vm && (vm.$accessor || (vm.$root && vm.$root.$accessor));
      return !!(acc && acc.remote && acc.remote.hosting);
    } catch (e) { return false; }
  }
  function takeControl() {
    try {
      var root = document.getElementById("neko") || document.querySelector("[id^=app],#app");
      var vm = root && root.__vue__;
      var acc = vm && (vm.$accessor || (vm.$root && vm.$root.$accessor));
      if (!acc || !acc.remote) return false;
      if (!acc.remote.hosting) acc.remote.request();
      return !!acc.remote.hosting;
    } catch (e) { return false; }
  }
  // Right and middle clicks would reach the desktop and open VLC's own context menu on top of the
  // picture. Swallow them in the capture phase, before Neko's input layer sees them. The left button
  // (and touch taps, which Neko turns into left clicks) still works for the disc menus.
  function blockSecondary(e) {
    if (e.type === "contextmenu" || e.button === 2 || e.button === 1) {
      e.preventDefault();
      e.stopImmediatePropagation();
    }
  }
  ["contextmenu", "mousedown", "mouseup", "auxclick", "pointerdown", "pointerup"].forEach(function (name) {
    window.addEventListener(name, blockSecondary, true);
  });
  var focusTries = 0;
  var focusTimer = setInterval(function () {
    if (!reported) { if (++focusTries > 40) clearInterval(focusTimer); return; }
    var controlled = takeControl();
    var focused = focusInput();
    if (++focusTries > 40 || (controlled && focused)) clearInterval(focusTimer);
  }, 500);
  window.addEventListener("focus", function () { if (reported) focusInput(); });

  // The catalog page's big start button was clicked (a real user gesture): take control, focus the
  // input layer and make sure the stream is audible.
  window.addEventListener("message", function (e) {
    if (e.source !== window.parent || !e.data || e.data.streamiso !== true || e.data.type !== "start") return;
    takeControl();
    focusInput();
    var v = document.querySelector("video");
    if (v) { try { v.muted = false; v.volume = 1; var p = v.play(); if (p && p.catch) p.catch(function () {}); } catch (err) { /* ignore */ } }
  });

  window.addEventListener("keydown", function (e) {
    var action = MEDIA[e.key] || MEDIA[e.keyCode] || (BACK[e.key] ? "back" : null);
    if (action) {
      send({ type: "key", action: action });
    } else if (NAV[e.key] && !hasControl()) {
      send({ type: "key", action: "nav-" + NAV[e.key] });
    } else {
      // any other key: show the controls briefly (the key still goes to VLC)
      activity();
    }
  }, true);

  // Only the keys a disc needs go on to VLC: arrows, Enter and Space. Anything else (Esc and F leave
  // fullscreen and bring up VLC's own menu bar, plus all of VLC's single-letter shortcuts) is kept
  // away from Neko's input layer. This listener is registered after the one above, so the controls
  // still show up for every key. Nothing is preventDefault-ed, so the browser keeps its own keys
  // (Esc leaves the page's full screen, F5, F11, ...).
  var PASS = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, Enter: 1, " ": 1 };
  function filterKey(e) {
    if (PASS[e.key] && !e.ctrlKey && !e.altKey && !e.metaKey) return;
    if (MEDIA[e.key] || MEDIA[e.keyCode] || BACK[e.key]) return;
    e.stopImmediatePropagation();
  }
  ["keydown", "keyup", "keypress"].forEach(function (name) {
    window.addEventListener(name, filterKey, true);
  });
})();
</script>
