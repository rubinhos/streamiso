; Replaces /etc/neko/supervisord/vlc.conf from the ghcr.io/m1k1o/neko/vlc image.
; - openbox: window manager; without it VLC cannot go fullscreen.
; - streamiso-patch: adds a small bridge script to the Neko web page (activity and media keys).
; - streamiso-launcher: opens the ISO picked in the catalog; VLC's rc interface serves the player controls.
; If the image changes this file's format, view the original with:
;   docker run --rm --entrypoint cat ghcr.io/m1k1o/neko/vlc:latest /etc/neko/supervisord/vlc.conf

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/bin/bash -c 'if [ -f /etc/neko/openbox.xml ]; then exec openbox --config-file /etc/neko/openbox.xml; else exec openbox; fi'
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:streamiso-patch]
command=/bin/bash /opt/streamiso/patch-neko.sh
autorestart=false
startsecs=0
priority=50
user=root
stdout_logfile=/var/log/neko/streamiso-patch.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true

[program:streamiso-launcher]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/bin/bash /opt/streamiso/launcher.sh
autorestart=true
priority=800
user=%(ENV_USER)s
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/neko/streamiso-launcher.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
