<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamISO</title>
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0d0f1c">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1 class="brand"><img src="/static/logo.svg" alt="StreamISO" class="logo"></h1>
    <span id="count" class="muted"></span>
    <div class="spacer"></div>
    <input id="filter" type="search" placeholder="Filter…" autocomplete="off">
    <select id="sort" aria-label="Sort by">
      <option value="title">Title (A–Z)</option>
      <option value="year-desc">Year (newest)</option>
      <option value="year-asc">Year (oldest)</option>
      <option value="added">Recently added</option>
      <option value="series">Series &amp; season</option>
    </select>
    <select id="genre" aria-label="Genre"><option value="">All genres</option></select>
    <select id="kind" aria-label="Type">
      <option value="">All types</option>
      <option value="dvd">DVDs</option>
      <option value="cd">Music CDs</option>
    </select>
    <!-- Shows or hides the discs already watched (DVDs) or listened to (CDs); hidden at first. -->
    <button id="seen" type="button" aria-pressed="false">
      <svg class="eye" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 5C6.5 5 2.3 8.6 1 12c1.3 3.4 5.5 7 11 7s9.7-3.6 11-7c-1.3-3.4-5.5-7-11-7zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
      <svg class="eye-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M2.3 3.7 3.7 2.3l18 18-1.4 1.4-3.4-3.4A12 12 0 0 1 12 19c-5.5 0-9.7-3.6-11-7a12.6 12.6 0 0 1 4.2-5.3L2.3 3.7zM12 5c5.5 0 9.7 3.6 11 7a12.4 12.4 0 0 1-3.3 4.6l-3.3-3.3A4.5 4.5 0 0 0 10.7 7.6L8.3 5.2C9.5 5.1 10.7 5 12 5zm-4.4 4.1A4.5 4.5 0 0 0 14.9 15.4l-1.5-1.5a2.5 2.5 0 0 1-3.3-3.3L7.6 9.1z"/></svg>
      <span class="lbl"></span>
    </button>
    <button id="rescan" type="button" title="Look for new ISO files" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      <span class="lbl">Refresh</span>
    </button>
    <!-- Only shown inside the Android app, which can switch to another StreamISO server. -->
    <button id="server" type="button" title="Connect to another server" aria-label="Server" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 3h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm0 10h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1zm3-7.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm0 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>
      <span class="lbl">Server</span>
    </button>
  </header>

  <main>
    <div id="grid"></div>
    <p id="empty" class="muted" hidden></p>
  </main>

  <div id="opening" hidden>
    <div>
      <div class="spinner"></div>
      <p id="opening-title"></p>
      <p class="muted">Opening disc…</p>
    </div>
  </div>

  <div id="season" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="se-heading">
    <div class="panel season-panel">
      <div class="season-head">
        <div>
          <h2 id="se-heading"></h2>
          <p id="se-info" class="muted small"></p>
        </div>
        <div class="spacer"></div>
        <button type="button" id="se-close" title="Close" aria-label="Close">&#x2715;</button>
      </div>
      <div id="se-cards" class="cards" role="list"></div>
    </div>
  </div>

  <div id="editor" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="ed-heading">
    <form id="ed-form" class="panel" autocomplete="off">
      <h2 id="ed-heading">Edit disc</h2>
      <p id="ed-info" class="muted small"></p>

      <div class="ed-grid">
        <div class="ed-cover">
          <img id="ed-cover" alt="Current cover">
          <label class="check fill-check"><input id="ed-fill" type="checkbox"> Fill the space</label>
          <label class="btn" for="ed-cover-file">Change cover</label>
          <input id="ed-cover-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          <button type="button" id="ed-posters" hidden>Choose online poster</button>
          <button type="button" id="ed-cover-remove">Remove custom cover</button>
          <p id="ed-cover-note" class="muted small" hidden></p>
        </div>

        <div class="ed-fields">
          <label>Title
            <input id="ed-title" type="text" maxlength="200">
          </label>
          <label>Sort as <span class="muted small">(empty: by the title)</span>
            <input id="ed-sort" type="text" maxlength="200">
          </label>
          <div class="row">
            <label>Year
              <input id="ed-year" type="number" min="1888" max="2100">
            </label>
            <label>Season
              <input id="ed-season" type="number" min="0" max="999">
            </label>
            <label>Disc
              <input id="ed-disc" type="number" min="1" max="999">
            </label>
          </div>
          <label>Genres <span class="muted small">(comma-separated, or click below)</span>
            <input id="ed-genres" type="text">
          </label>
          <div id="ed-chips" class="chips"></div>
          <label>Synopsis
            <textarea id="ed-synopsis" rows="5" maxlength="4000"></textarea>
          </label>
          <div class="lookup">
            <label class="grow">Search online as
              <input id="ed-query" type="text" maxlength="200" placeholder="Name of the series, film or album">
            </label>
            <button type="button" id="ed-lookup">Search again</button>
          </div>
          <p id="ed-lookup-note" class="muted small" hidden></p>
          <label class="check"><input id="ed-watched" type="checkbox"> <span id="ed-watched-label">Watched</span></label>
        </div>
      </div>

      <p id="ed-error" class="error" hidden></p>
      <div class="actions">
        <button type="button" id="ed-reset" class="danger">Clear edits</button>
        <div class="spacer"></div>
        <button type="button" id="ed-cancel">Cancel</button>
        <button type="submit" id="ed-save" class="primary">Save</button>
      </div>
    </form>
  </div>

  <div id="posters" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="pk-heading">
    <div class="panel picker-panel">
      <div class="season-head">
        <h2 id="pk-heading">Choose a poster</h2>
        <div class="spacer"></div>
        <button type="button" id="pk-close" title="Close" aria-label="Close">&#x2715;</button>
      </div>
      <div class="lookup">
        <label class="grow">Search for
          <input id="pk-query" type="text" maxlength="200">
        </label>
        <button type="button" id="pk-search">Search</button>
      </div>
      <label id="pk-all-row" class="check" hidden><input id="pk-all" type="checkbox"> <span id="pk-all-label"></span></label>
      <p id="pk-note" class="muted small"></p>
      <div id="pk-body"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
