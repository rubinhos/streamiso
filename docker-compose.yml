name: streamiso

services:
  # DVD player (VLC with menus) streamed over WebRTC
  neko:
    image: ${NEKO_IMAGE:-ghcr.io/m1k1o/neko/vlc:latest}
    container_name: streamiso-neko
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "${NEKO_PORT:-8081}:8080"
      - "52000-52100:52000-52100/udp"
    environment:
      NEKO_DESKTOP_SCREEN: "1280x720@30"
      NEKO_MEMBER_PROVIDER: "multiuser"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "${NEKO_PASSWORD:-neko}"
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "${NEKO_ADMIN_PASSWORD:-change-this-password}"
      NEKO_WEBRTC_EPR: "52000-52100"
      # whoever clicks or types on the video gets control automatically
      NEKO_SESSION_IMPLICIT_HOSTING: "true"
      NEKO_WEBRTC_NAT1TO1: "${SERVER_IP:?set SERVER_IP in the .env file (the server's IP on your network)}"
      STATE_FILE: "/state/current"
      MEDIA_PREFIX: "/media/"
    # VLC's remote-control port (4212) is not published: only the catalog reaches it, inside this network
    volumes:
      - "${DVD_DIR:-${MEDIA_DIR:-./empty}}:/media/dvds:ro"
      - "${CD_DIR:-${MEDIA_DIR:-./empty}}:/media/cds:ro"
      - "./state:/state:ro"
      - "./neko/vlc.conf:/etc/neko/supervisord/vlc.conf:ro"
      - "./neko:/opt/streamiso:ro"

  # Library with covers, metadata editing, and the API that drives the player
  catalog:
    build: ./catalog
    container_name: streamiso-catalog
    restart: unless-stopped
    ports:
      - "${CATALOG_PORT:-8080}:8080"
    environment:
      DVD_DIR: "/media/dvds"
      CD_DIR: "/media/cds"
      DATA_DIR: "/data"
      STATE_FILE: "/state/current"
      NEKO_PORT: "${NEKO_PORT:-8081}"
      NEKO_USER: "tv"
      NEKO_PASSWORD: "${NEKO_PASSWORD:-neko}"
      NEKO_PUBLIC_URL: "${NEKO_PUBLIC_URL:-}"
      VLC_RC_HOST: "neko"
      VLC_RC_PORT: "4212"
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      TMDB_LANGUAGE: "${TMDB_LANGUAGE:-en-US}"
      MUSICBRAINZ_CONTACT: "${MUSICBRAINZ_CONTACT:-}"
    volumes:
      - "${DVD_DIR:-${MEDIA_DIR:-./empty}}:/media/dvds:ro"
      - "${CD_DIR:-${MEDIA_DIR:-./empty}}:/media/cds:ro"
      - "./data:/data"
      - "./state:/state"
