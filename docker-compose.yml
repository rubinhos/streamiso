name: streamiso

services:
  # DVD and Blu-ray player (VLC with menus) streamed over WebRTC. Built from Neko's VLC image (NEKO_IMAGE) with
  # Java for Blu-ray menus: see neko/Dockerfile.
  neko:
    build:
      context: ./neko
      args:
        NEKO_IMAGE: "${NEKO_IMAGE:-ghcr.io/m1k1o/neko/vlc:latest}"
    image: streamiso-neko
    container_name: streamiso-neko
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "${NEKO_PORT:-8081}:8080"
      - "52000-52100:52000-52100/udp"
    environment:
      # Stream quality, set in .env. VLC draws the disc on this screen and Neko encodes it live in H.264,
      # which TVs and browsers decode in hardware (docker-compose.vp8.yml switches to VP8, see the README).
      NEKO_DESKTOP_SCREEN: "${STREAM_RESOLUTION:-1024x576}@${STREAM_FPS:-30}"
      NEKO_CAPTURE_VIDEO_CODEC: "h264"
      NEKO_CAPTURE_VIDEO_IDS: "main"
      # x264 tuned for live streaming, with the frame rate and bit rate (kbit/s) taken from .env. A key frame
      # every second repairs a lost packet quickly; constrained baseline is what every WebRTC client decodes.
      NEKO_CAPTURE_VIDEO_PIPELINES: '{"main":{"fps":${STREAM_FPS:-30},"gst_prefix":"! video/x-raw,format=I420","gst_encoder":"x264enc","gst_params":{"threads":"4","bitrate":"${STREAM_BITRATE:-4000}","key-int-max":"${STREAM_FPS:-30}","byte-stream":"true","tune":"zerolatency","speed-preset":"veryfast"},"gst_suffix":"! video/x-h264,stream-format=byte-stream,profile=constrained-baseline"}}'
      DVD_DEINTERLACE: "${DVD_DEINTERLACE:-yadif}"
      DVD_MENU_LANGUAGE: "${DVD_MENU_LANGUAGE:-}"
      DVD_AUDIO_LANGUAGE: "${DVD_AUDIO_LANGUAGE:-}"
      DVD_SUBTITLE_LANGUAGE: "${DVD_SUBTITLE_LANGUAGE:-}"
      NEKO_MEMBER_PROVIDER: "multiuser"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "${NEKO_PASSWORD:-neko}"
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "${NEKO_ADMIN_PASSWORD:-change-this-password}"
      NEKO_WEBRTC_EPR: "52000-52100"
      # whoever clicks or types on the video gets control automatically
      NEKO_SESSION_IMPLICIT_HOSTING: "true"
      NEKO_WEBRTC_NAT1TO1: "${SERVER_IP:?set SERVER_IP in the .env file (the server's IP on your network)}"
      STATE_FILE: "/state/current"
      MEDIA_PREFIX: "/media/"
      # Plain video for TVs whose WebRTC cannot connect (webOS 3): the same screen and sound as HLS segments of
      # one second in the shared hls volume. Off until such a TV asks the catalog for it (/api/stream/hls),
      # which then starts and stops it, so this second encoding only runs while it is watched.
      NEKO_CAPTURE_BROADCAST_AUTOSTART: "false"
      NEKO_CAPTURE_BROADCAST_PIPELINE: >-
        ximagesrc display-name={display} show-pointer=false use-damage=false
        ! video/x-raw,framerate=${STREAM_FPS:-30}/1 ! videoconvert ! queue
        ! x264enc threads=4 bitrate=${HLS_BITRATE:-2500} key-int-max=${STREAM_FPS:-30} byte-stream=true
        tune=zerolatency speed-preset=veryfast ! video/x-h264,profile=main ! h264parse ! queue ! mux.
        pulsesrc device={device} ! audio/x-raw,channels=2 ! audioconvert ! audioresample
        ! voaacenc bitrate=128000 ! aacparse ! queue ! mux.
        mpegtsmux name=mux ! hlssink playlist-location=/hls/index.m3u8 location=/hls/seg%05d.ts
        target-duration=1 max-files=12 playlist-length=4
    # VLC's remote-control port (4212) is not published: only the catalog reaches it, inside this network
    volumes:
      - "${DVD_DIR:-${MEDIA_DIR:-./empty}}:/media/dvds:ro"
      - "${CD_DIR:-${MEDIA_DIR:-./empty}}:/media/cds:ro"
      # Only its own folder: with MEDIA_DIR, Blu-ray images among the DVDs are found by their content.
      - "${BLURAY_DIR:-./empty}:/media/blurays:ro"
      - "./state:/state:ro"
      - "./neko/vlc.conf:/etc/neko/supervisord/vlc.conf:ro"
      - "./neko:/opt/streamiso:ro"
      - "hls:/hls"

  # Library with covers, metadata editing, and the API that drives the player. The image holds the Go service
  # (catalog/) and the web page built from web/, so it is built from the repository root.
  catalog:
    build:
      context: .
      dockerfile: catalog/Dockerfile
    container_name: streamiso-catalog
    restart: unless-stopped
    ports:
      - "${CATALOG_PORT:-8080}:8080"
    environment:
      DVD_DIR: "/media/dvds"
      CD_DIR: "/media/cds"
      BLURAY_DIR: "/media/blurays"
      DATA_DIR: "/data"
      STATE_FILE: "/state/current"
      NEKO_PORT: "${NEKO_PORT:-8081}"
      NEKO_USER: "tv"
      NEKO_PASSWORD: "${NEKO_PASSWORD:-neko}"
      NEKO_PUBLIC_URL: "${NEKO_PUBLIC_URL:-}"
      CORS_ORIGIN: "${CORS_ORIGIN:-}"
      VLC_RC_HOST: "neko"
      VLC_RC_PORT: "4212"
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      TMDB_LANGUAGE: "${TMDB_LANGUAGE:-en-US}"
      MUSICBRAINZ_CONTACT: "${MUSICBRAINZ_CONTACT:-}"
      # Starts and stops Neko's plain video broadcast for old TVs, and serves it (see catalog/internal/adapters/neko)
      HLS_DIR: "/hls"
      NEKO_INTERNAL_URL: "http://neko:8080"
      NEKO_ADMIN_PASSWORD: "${NEKO_ADMIN_PASSWORD:-change-this-password}"
    volumes:
      - "${DVD_DIR:-${MEDIA_DIR:-./empty}}:/media/dvds:ro"
      - "${CD_DIR:-${MEDIA_DIR:-./empty}}:/media/cds:ro"
      # Only its own folder: with MEDIA_DIR, Blu-ray images among the DVDs are found by their content.
      - "${BLURAY_DIR:-./empty}:/media/blurays:ro"
      - "./data:/data"
      - "./state:/state"
      - "hls:/hls"

volumes:
  # The plain video's playlist and last few segments, written by Neko and served by the catalog
  hls:
